---
title: Powers
---

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">

<style>
  .powers-page { font-family: 'Source Sans Pro', sans-serif; color: #2c1a0e; max-width: 1100px; margin: 0 auto; padding: 1rem 0 3rem; }
  .powers-intro { font-size: 15px; color: #555; margin-bottom: 2rem; line-height: 1.6; }
  .section-title { font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 600; color: #1a3d2b; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid #d4c5a0; }
  .filter-section { margin-bottom: 1.5rem; }
  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 0.75rem; }
  .filter-btn { padding: 5px 14px; border-radius: 999px; border: 1px solid #c9a84c; background: #faf5ec; color: #8b6914; font-size: 13px; cursor: pointer; transition: all 0.15s; font-family: 'Source Sans Pro', sans-serif; }
  .filter-btn:hover { background: #f5ead0; }
  .filter-btn.active { background: #1a3d2b; color: #f5f0e8; border-color: #1a3d2b; }
  .filter-btn.all-btn.active { background: #2c1a0e; color: #f5f0e8; border-color: #2c1a0e; }
  .filter-mode { display: flex; gap: 8px; align-items: center; font-size: 13px; color: #888; }
  .mode-btn { padding: 4px 12px; border-radius: 6px; border: 1px solid #d4c5a0; background: #faf5ec; color: #888; font-size: 12px; cursor: pointer; font-family: 'Source Sans Pro', sans-serif; transition: all 0.15s; }
  .mode-btn.active { background: #2c1a0e; color: #f5f0e8; border-color: #2c1a0e; }
  .powers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .power-card { background: #faf5ec; border: 1px solid #d4c5a0; border-radius: 10px; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.15s; }
  .power-card:hover { border-color: #c9a84c; }
  .power-card.hidden { display: none; }
  .power-card.is-flaw { border-left: 3px solid #c0392b; }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .power-name { font-family: 'Cinzel', serif; font-size: 14px; font-weight: 600; color: #1a3d2b; }
  .flaw-label { font-size: 10px; font-weight: 600; color: #c0392b; text-transform: uppercase; letter-spacing: 0.05em; display: inline-block; margin-left: 6px; }
  .power-cost { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .cost-pos { background: #e8f5e3; color: #2d6b4a; border: 1px solid #b8ddb0; }
  .cost-neg { background: #fbe9e7; color: #c0392b; border: 1px solid #f0c0bb; }
  .tag-pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag-pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid; font-weight: 600; }
  .tag-strike { background: #fbe9e7; color: #c0392b; border-color: #f0c0bb; }
  .tag-vitality { background: #e8f5e3; color: #2d6b4a; border-color: #b8ddb0; }
  .tag-aegis { background: #e8f0fb; color: #1a5ca8; border-color: #b0c8f0; }
  .tag-universal { background: #fef8e7; color: #8b6914; border-color: #f0d880; }
  .tag-divine { background: #f0eafa; color: #6b3fa0; border-color: #d0b8f0; }
  .tag-elemental { background: #fef0e0; color: #a05010; border-color: #f0c888; }
  .tag-martial { background: #f0f0f0; color: #555; border-color: #ccc; }
  .power-prereq { font-size: 11px; color: #aaa; margin-top: 2px; }
  .power-desc { font-size: 13px; color: #4a3828; line-height: 1.6; }
  .power-enhance { font-size: 12px; color: #888; border-top: 1px solid #e8ddc8; padding-top: 8px; margin-top: 4px; line-height: 1.5; }
  .power-enhance strong { color: #6b5030; }
  .power-restriction { font-size: 12px; color: #a05010; font-style: italic; margin-top: 2px; }
  .no-results { padding: 3rem; text-align: center; color: #aaa; font-size: 14px; }
  .results-count { font-size: 12px; color: #aaa; margin-bottom: 1rem; }
</style>

<div class="powers-page">
  <p class="powers-intro">Select one or more tags to filter powers. Use <strong>Match any</strong> to show powers with at least one selected tag, or <strong>Match all</strong> to show only powers that have every selected tag.</p>

  <div class="filter-section">
    <div class="section-title">Filter by tag</div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="filter-mode">
      <span>Filter mode:</span>
      <button class="mode-btn active" id="modeAny" onclick="setMode('any')">Match any tag</button>
      <button class="mode-btn" id="modeAll" onclick="setMode('all')">Match all tags</button>
    </div>
  </div>

  <div class="results-count" id="resultsCount"></div>
  <div class="powers-grid" id="powersGrid"></div>
  <div class="no-results hidden" id="noResults">No powers match the selected tags.</div>
</div>

<script>

  { name: "Bulwark", cost: "+4", tags: ["Aegis"], desc: "When you gain an Aegis Bonus from this feat, one ally within 15 feet gains half that bonus (rounded down, minimum 1) for the same duration.", enhance: "(+4) One additional ally within range gains this benefit and the range increases by 15 feet." },
  { name: "Entrenched", cost: "+3", tags: ["Aegis"], desc: "If you did not move during your turn, increase this feat's Aegis Bonus by 1 until the start of your next turn. Stacks to a maximum of +2, resets when you move.", enhance: "(+3) Increase the maximum by +1." },
  { name: "Interpose", cost: "+5", tags: ["Aegis", "Martial"], desc: "While benefiting from this feat's Aegis Bonus, when a creature you can see attacks an ally within 15 feet, you can become the target of that attack instead, gaining +2 AC.", enhance: "(+5) Increase the range by 15 feet and the AC bonus by +2.", prereq: "Martial" },
  { name: "Resolute", cost: "+4", tags: ["Aegis"], desc: "This feat's Aegis Bonus also applies to saving throws made with one stat of your choice, chosen when you take this power.", enhance: "(+4) Choose an additional stat." },
  { name: "Riposte", cost: "+5", tags: ["Aegis", "Martial"], desc: "If you successfully negate an attack while benefiting from this feat's Aegis Bonus, roll 1 Strike Die against the attacker (if within range).", enhance: "(+5) Roll one additional Strike Die.", prereq: "Martial" },
  { name: "Siphon", cost: "+4", tags: ["Aegis"], desc: "The first time each round you successfully negate an attack while benefiting from this feat's Aegis Bonus, gain 3 Temporary Hit Points.", enhance: "(+3) Increase the Temporary Hit Points gained by 3." },
  { name: "Unyielding", cost: "+6", tags: ["Aegis"], desc: "While benefiting from this feat's Aegis Bonus, the first time you would be reduced to 0 Hit Points, you are instead reduced to 1 and the Aegis Bonus immediately ends.", restriction: "Once per scene. Cannot be taken more than once or enhanced." },
  { name: "Deadly", cost: "+4", tags: ["Strike"], desc: "If you deal Critical Damage with Strike Dice, deal an additional Strike Die.", enhance: "(+3) Roll one additional Strike Die." },
  { name: "Engulf", cost: "+5", tags: ["Strike"], desc: "If you deal damage with Strike Dice, deal 1 Strike Die to all creatures within 10 feet.", enhance: "(+3) Deal an additional Strike Die and range increases by 10 feet." },
  { name: "Fester", cost: "+5", tags: ["Strike"], desc: "If you deal damage with Strike Dice to a Bloodied creature, they gain vulnerability 5 to that damage type for 1 round.", enhance: "(+5) Vulnerability increases by 5 and duration increases by 1 round." },
  { name: "Penetrating", cost: "+4", tags: ["Strike"], desc: "If you deal damage with Strike Dice, the target gains −1 to AC for 1 round.", enhance: "(+2) Increase the AC penalty by −1 and duration by 1 round." },
  { name: "Rapid", cost: "+5", tags: ["Strike"], desc: "Saving throws with physical stats (Str, Dex, Con) take −2. Attack rolls gain +2.", enhance: "(+5) Increase saving throw penalty by −2 and attack roll bonus by +2." },
  { name: "Far Sight", cost: "+3", tags: ["Universal"], desc: "Increase the range of this effect by half its value (minimum 5 feet). Touch or 5-foot range increases by 10 feet instead.", enhance: "(+2) Increases range by an additional half of its value." },
  { name: "Fortune", cost: "+4", tags: ["Universal"], desc: "If this feat affects an ally, their next d20 roll gains a +2 bonus.", enhance: "(+4) Increase the d20 bonus by +2." },

  { name: "Electrocuting", cost: "+3", tags: ["Strike", "Aegis", "Vitality", "Elemental"], desc: "Variable. #Strike: chain 1d6 electricity to creature within 10 feet. #Aegis: attacker takes 1d6 electricity. #Vitality: target gains +5 feet movement for 1 round.", enhance: "(+3) Increase damage, range, or movement.", prereq: "Elemental" },
  { name: "Frigid", cost: "+3", tags: ["Strike", "Aegis", "Vitality", "Elemental"], desc: "Variable. #Strike: 1 persistent cold damage; −5 movement speed. #Aegis: −10 movement speed for +2 AC. #Vitality: target gains 4 Temporary Hit Points.", enhance: "(+3) Increase damage, penalty, or Temporary Hit Points.", prereq: "Elemental" },
  { name: "Limitless", cost: "+6", tags: ["Strike", "Aegis", "Vitality"], desc: "Variable. Sacrifice key ability rolls (Hindered) for boons. #Strike: +2 Strike Dice, step up all dice. #Aegis: resistance 10 to next hit. #Vitality: +2 Vitality Dice, step up all dice.", restriction: "Cannot be taken more than once or enhanced." },
  { name: "Sacred Strike", cost: "+3", tags: ["Strike", "Divine"], desc: "Damage type becomes radiant. Undead and fiends take 1 additional Strike Die.", enhance: "(+3) Additional Strike Die increases by 1.", prereq: "Divine" },
  { name: "Holy Resilience", cost: "+3", tags: ["Aegis", "Divine"], desc: "While benefiting from this feat's Aegis Bonus, target gains a bonus to saves vs Frightened and Charmed equal to the Aegis Bonus granted.", enhance: "(+3) Also applies to Stunned and Paralyzed.", prereq: "Divine" },
  { name: "Blessed Mending", cost: "+3", tags: ["Vitality", "Divine"], desc: "When this feat rolls Vitality Dice to heal a creature, the target removes 1 persistent damage type currently affecting them.", enhance: "(+3) Remove 1 additional persistent damage type.", prereq: "Divine" },
  { name: "Divine Conduit", cost: "+4", tags: ["Vitality", "Divine"], desc: "When this feat restores Hit Points, the target's next attack before the start of your next turn deals 1 Strike Die of radiant damage on a hit.", enhance: "(+4) The Strike Die increases by 1.", prereq: "Divine" },
  { name: "Warding Faith", cost: "+4", tags: ["Aegis", "Divine"], desc: "While benefiting from this feat's Aegis Bonus, the target cannot be targeted by effects that read, alter, or control their mind.", restriction: "Cannot be enhanced.", prereq: "Divine" },
  { name: "Smiting Blow", cost: "+4", tags: ["Strike", "Divine"], desc: "If you deal damage with Strike Dice to an undead or fiend, they must make a Wisdom save vs Class DC or be Frightened 1 until end of their next turn.", enhance: "(+4) Target is Frightened 2 on a failed save.", prereq: "Divine" },
  { name: "Radiant Overflow", cost: "+4", tags: ["Vitality", "Divine"], desc: "When this feat restores Hit Points, excess beyond the target's maximum is converted to radiant damage dealt to one enemy within 15 feet.", restriction: "Cannot be enhanced.", prereq: "Divine" },
  { name: "Consecrated Defense", cost: "+3", tags: ["Aegis", "Divine"], desc: "While benefiting from this feat's Aegis Bonus, the target gains resistance equal to the Aegis Bonus to necrotic damage.", enhance: "(+3) Also applies to poison damage.", prereq: "Divine" },
  { name: "Turning", cost: "+5", tags: ["Strike", "Divine"], desc: "If you deal damage with Strike Dice to an undead creature, they must make a Wisdom save vs Class DC or spend all actions next turn moving away from you.", restriction: "Cannot be enhanced.", prereq: "Divine" },
  { name: "Divine Recovery", cost: "+4", tags: ["Vitality", "Divine"], desc: "When this feat restores Hit Points to a Bloodied creature, roll 1 additional Vitality Die and the target gains Favored on their next Constitution saving throw.", enhance: "(+4) Roll 1 additional Vitality Die.", prereq: "Divine" },
  { name: "Shoddy Protection", cost: "−4", tags: ["Aegis"], flaw: true, desc: "If you take damage while benefiting from an Aegis Bonus, take an additional Weapon Die or Strike Die of damage." },
  { name: "Exposed Flanks", cost: "−5", tags: ["Aegis"], flaw: true, desc: "While the Aegis Bonus is active, the Flanking bonus for enemies increases by +2." },
  { name: "Fading Defense", cost: "−4", tags: ["Aegis"], flaw: true, desc: "The Aegis Bonus decreases by 1 at the start of each of the target's turns until it reaches 0. Cannot be refreshed on the same target in the same scene." },
  { name: "Delayed Protection", cost: "−4", tags: ["Aegis"], flaw: true, desc: "The Aegis Bonus does not take effect until the start of the target's next turn." },

  { name: "Horrifying", cost: "−2", tags: ["Universal"], flaw: true, desc: "If a creature sees you use this feat, you are Hindered on all Charisma rolls with them until they become accustomed to you." },
  { name: "Backlash", cost: "−4", tags: ["Universal"], flaw: true, desc: "When you use this feat, take 1d4 force damage that cannot be reduced. Cannot reduce you below 1 Hit Point." },
  { name: "Mental Strain", cost: "−3", tags: ["Universal"], flaw: true, desc: "When you use this feat, suffer −2 to a mental stat of your choice for 1 hour. Can be taken multiple times for different stats." },
  { name: "Physical Strain", cost: "−3", tags: ["Universal"], flaw: true, desc: "When you use this feat, suffer −2 to a physical stat of your choice for 1 hour. Can be taken multiple times for different stats." },
  { name: "Slow", cost: "−3", tags: ["Universal"], flaw: true, desc: "When you use this feat, reduce movement speed by 5 feet for 1 minute. Stacks but does not refresh. Cannot use if speed reaches 5 feet." },
  { name: "Uncontrollable", cost: "−8", tags: ["Universal"], flaw: true, desc: "When selecting targets, make a DC 11 flat check. On failure, the feat randomly affects a target including yourself." },
  { name: "Overabundant Vitality", cost: "−3", tags: ["Vitality"], flaw: true, desc: "If you roll maximum on any Vitality Die, deal force damage equal to half the value to the target instead of healing. Cannot be reduced or ignored." },
  { name: "Sapped Vitality", cost: "−4", tags: ["Vitality"], flaw: true, desc: "When you roll Vitality Dice, reduce the die value by 1 (minimum d4)." },
  { name: "Healing Resilient", cost: "−4", tags: ["Vitality"], flaw: true, desc: "When you use this feat, gain −5 to all healing received for the next minute." },

const tagClassMap = { strike:'tag-strike', vitality:'tag-vitality', aegis:'tag-aegis', universal:'tag-universal', divine:'tag-divine', elemental:'tag-elemental', martial:'tag-martial' };
let selectedTags = new Set();
let filterMode = 'any';

function getTagClass(tag) { return tagClassMap[tag.toLowerCase()] || ''; }

function getAllTags() {
  const s = new Set();
  powers.forEach(p => p.tags.forEach(t => s.add(t)));
  return Array.from(s).sort();
}

function buildFilters() {
  const bar = document.getElementById('filterBar');
  bar.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn all-btn active';
  allBtn.textContent = 'All';
  allBtn.onclick = () => { selectedTags.clear(); updateFilters(); };
  bar.appendChild(allBtn);
  getAllTags().forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = '#' + tag;
    btn.dataset.tag = tag;
    btn.onclick = () => { selectedTags.has(tag) ? selectedTags.delete(tag) : selectedTags.add(tag); updateFilters(); };
    bar.appendChild(btn);
  });
}

function setMode(mode) {
  filterMode = mode;
  document.getElementById('modeAny').className = 'mode-btn' + (mode === 'any' ? ' active' : '');
  document.getElementById('modeAll').className = 'mode-btn' + (mode === 'all' ? ' active' : '');
  updateFilters();
}

function updateFilters() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    if (btn.classList.contains('all-btn')) btn.classList.toggle('active', selectedTags.size === 0);
    else btn.classList.toggle('active', selectedTags.has(btn.dataset.tag));
  });
  let visible = 0;
  document.querySelectorAll('.power-card').forEach(card => {
    const cardTags = card.dataset.tags.split(',');
    let show = selectedTags.size === 0 || (filterMode === 'any' ? [...selectedTags].some(t => cardTags.includes(t)) : [...selectedTags].every(t => cardTags.includes(t)));
    card.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  document.getElementById('noResults').classList.toggle('hidden', visible > 0);
  document.getElementById('resultsCount').textContent = selectedTags.size > 0 ? `Showing ${visible} of ${powers.length} powers` : `${powers.length} powers total`;
}

function buildCards() {
  const grid = document.getElementById('powersGrid');
  powers.forEach(p => {
    const card = document.createElement('div');
    card.className = 'power-card' + (p.flaw ? ' is-flaw' : '');
    card.dataset.tags = p.tags.join(',');
    const costClass = (p.cost.startsWith('−') || p.cost.startsWith('-')) ? 'cost-neg' : 'cost-pos';
    const flawLabel = p.flaw ? '<span class="flaw-label">Flaw</span>' : '';
    const tagPills = p.tags.map(t => `<span class="tag-pill ${getTagClass(t)}">#${t}</span>`).join('');
    const prereq = p.prereq ? `<div class="power-prereq">Requires: #${p.prereq}</div>` : '';
    const enhance = p.enhance ? `<div class="power-enhance"><strong>Enhance:</strong> ${p.enhance}</div>` : '';
    const restriction = p.restriction ? `<div class="power-restriction">⚑ ${p.restriction}</div>` : '';
    card.innerHTML = `
      <div class="card-header">
        <div><div class="power-name">${p.name}${flawLabel}</div>${prereq}</div>
        <span class="power-cost ${costClass}">${p.cost}</span>
      </div>
      <div class="tag-pills">${tagPills}</div>
      <div class="power-desc">${p.desc}</div>
      ${enhance}${restriction}
    `;
    grid.appendChild(card);
  });
}

buildFilters();
buildCards();
updateFilters();
</script>
